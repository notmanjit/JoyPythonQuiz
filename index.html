<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assignment MCQ Practice – Weeks 1 to 12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f9;--surface:#fff;--ink:#16213a;--muted:#5b6580;--line:#d5dae8;--accent:#3347c9;--accent-ink:#fff;--ok:#17734c;--ok-bg:#e2f4ea;--bad:#b3261e;--bad-bg:#fbe7e5;--sel:#e8ebfb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1424;--surface:#181f35;--ink:#e8ecf8;--muted:#9aa5c4;--line:#2c3556;--accent:#8c9bff;--accent-ink:#0f1424;--ok:#5fd29a;--ok-bg:#12332a;--bad:#ff8f86;--bad-bg:#3a1b1d;--sel:#232c52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1424;--surface:#181f35;--ink:#e8ecf8;--muted:#9aa5c4;--line:#2c3556;--accent:#8c9bff;--accent-ink:#0f1424;--ok:#5fd29a;--ok-bg:#12332a;--bad:#ff8f86;--bad-bg:#3a1b1d;--sel:#232c52;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 8px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:820px;margin:0 auto}
h1{font-size:1.15rem;margin:0}
.total{color:var(--muted);font-size:.95rem;white-space:nowrap}
.weeks{display:flex;gap:6px;overflow-x:auto;max-width:820px;margin:8px auto 0;padding-bottom:4px}
.weeks button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 11px;font:inherit;font-size:.9rem;cursor:pointer}
.weeks button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.weeks small{display:block;font-size:.72rem;opacity:.8}
main{max-width:820px;margin:0 auto;padding:18px 16px 60px}
.wkhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h2{font-size:1.45rem;margin:.2em 0}
h3{font-size:1.15rem;margin:0 0 8px}
.scn{margin-top:30px}
.ctx{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:14px 16px}
.ctx p{margin:0;white-space:pre-wrap;max-width:70ch}
.ctx img{display:block;max-width:100%;height:auto;margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:4px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-top:14px}
.qt{white-space:pre-wrap;margin:0 0 4px;font-weight:700;max-width:70ch}
.qk{color:var(--muted);font-size:.85rem;margin:0 0 8px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.weeks button:focus-visible,.act:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt b{flex:none;min-width:1.5em}
.opt[aria-pressed="true"]{background:var(--sel);border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt .tag{margin-left:auto;font-size:.8rem;font-weight:700;white-space:nowrap}
.opt.ok .tag{color:var(--ok)}.opt.bad .tag{color:var(--bad)}
.opt:disabled{cursor:default}
.act{margin-top:10px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
.act:disabled{opacity:.45;cursor:not-allowed}
.act.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.fb{margin-top:12px;padding:12px 14px;border-radius:8px;border:1px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb strong{display:block}
.fb p{margin:6px 0 0;white-space:pre-wrap;max-width:70ch}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateY(-4px)}}}
</style></head><body>

 for different fitness challenges without changing the main logic. The students realize that loops are not just about reducing the number of lines of code—they make programs flexible, easier to maintain, and less prone to errors.", "images": [], "qs": [{"text": "Why did the second student recommend using a loop instead of writing every movement instruction separately?", "opts": {"A": "Loops allow repeated actions to be expressed with fewer instructions while preserving the same behavior.", "B": "Loops make the robot move faster.", "C": "Loops reduce the distance travelled by the robot.", "D": "Loops automatically correct programming errors."}, "ans": ["A"], "just": "A loop eliminates repetitive code by executing the same sequence multiple times.", "hint": "Q1. Why did ", "msq": false}, {"text": "In the improved program, what is the primary purpose of using a variable for the travel distance?", "opts": {"A": "To store the robot's battery level.", "B": "To allow the distance to change automatically after each repetition.", "C": "To count how many students are programming.", "D": "To increase the robot's speed."}, "ans": ["B"], "just": "The variable stores the current distance and is updated after each iteration, allowing the robot to travel progressively farther.", "hint": "Q2. In the i", "msq": false}, {"text": "The instructor later replaces the fixed starting distance with another variable. What is the main advantage of this change?", "opts": {"A": "The robot no longer requires a loop.", "B": "The same program can easily be reused for different starting distances without rewriting the logic.", "C": "The program will execute only once.", "D": "Variables automatically make the program run faster."}, "ans": ["B"], "just": "Replacing fixed values with variables increases flexibility and reusability.", "hint": "Q3. The inst", "msq": false}, {"text": "Suppose a student removes the statement that updates the distance variable inside the loop. Which outcome is most likely?", "opts": {"A": "The robot will continue repeating the same movement distance in every round.", "B": "The robot will stop after the first movement.", "C": "The robot will automatically choose new distances.", "D": "The loop will immediately terminate."}, "ans": ["A"], "just": "Without updating the variable, its value remains unchanged, so every iteration performs the same movement.", "hint": "Q4. Suppose ", "msq": false}, {"text": "Which statement best summarizes the role of loops in programming?", "opts": {"A": "Loops are useful only for mathematical calculations.", "B": "Loops replace the need for variables.", "C": "Loops help automate repetitive tasks and make programs easier to modify and maintain.", "D": "Loops should be avoided because they make programs difficult to understand."}, "ans": ["C"], "just": "Loops improve readability, reduce duplication, and make programs easier to update and extend.", "hint": "Q5. Which st", "msq": false}]}, {"title": "Understanding a Scratch Program", "text": "A student is learning Scratch and creates the program shown in the figure below. The sprite starts from its initial position and executes each block from top to bottom exactly once. The student expects the sprite to follow the path specified by the movement and direction blocks. Study the Scratch program carefully that is presented below and answer the following questions based on the program shown.", "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAREAAAEQCAIAAAAYqtd8AAAACXBIWXMAAA7EAAAOxAGVKw4bAAAuxUlEQVR4nO2di18TV/73f//T89uutlpF7uHir939lW3r2lp322e3P3328VlqpYIXrsmE+01rsZXuYm2VrUopWmldlSKCKBISArmRBHJPIAQSEDzPmZkkhmSSzCQzmSScz+v74pUMkzNzZr7vnMtM5vMfa0hISEz0H3zvABJSigkxg4TETIgZJCRmQswgITETYgYJiZkQM0hIzISYQUJiJsQMEhIzIWaQkJgJMYOExEyIGSQkZkLMICExE2IGCYmZEDNISMyEmEFCYibEDBISMyFmkJCYCTGDhMRMiBkkJGaKxIzH41ldXXW73ZzuAdzKysoK/MvpVmAt4FY43QR5uKASsBV0UmiKi5MSiRlYH4vFsrS0xOmxW15eNhqNnB47uP+wFmazmdOEhoXbCXGa0OikMBIXJyUSMy6XC1ZpcXGR09PjdDoNBgPcFnebgPsPa2Eymbg+PTZCnDKDTgojcXFS ore the final movement, resulting in a different path.", "hint": "Q5. A studen", "msq": false}]}, {"title": "Evaluating a Scratch-Based Game Scoring System", "text": "A student is developing a simple game in Scratch to reward players based on their performance. The Scratch program shown in the figure keeps track of three variables: score, counter, and bonus. When the green flag is clicked, the variables are initialized. The program then repeats a set of instructions several times. During each repetition, the player's score increases, the round counter is updated, and a bonus is awarded depending on whether the current round number is even or odd. After all repetitions are complete, the accumulated bonus is added to the score.\n\nFinally, the program displays one of three messages—\"Excellent!\", \"Level Cleared!\", or \"Try Again!\"—depending on the final score. Study the Scratch program carefully and answer the following questions.", "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAWoAAAKiCAIAAABw6QHwAAAACXBIWXMAAA7EAAAOxAGVKw4bAACQQUlEQVR4nOy9d3gTV77///3r96TQ3AukbTY9oWTv3ZrNzSYQUujNgSQ2bNpu7u4mm1yWjnuVTAsl1FBs0YIxNj2AQyCEXmKSgClustV7ty3rd6SRRiNpZjSSRpqx/Xk/74dHHkZnzkjn85rPOXM05//ZAnT9+vXAjSAQCOSn/xe4CfABAoGYCPABAoHCFOADBAKFKS8+rAaNWSU2S26cW56h3PUhZlXVJ+qTq4zNVyI5hq5+v3LfbLxMcGg+uEh/dZ/VbIz4uwaBWJYbHxad0iz+0dJy0dp84cd/x1sKk3Abi9NlS36jPr0ujNItRq1szydqwZPmggRimWDmNubFa1b9UVW3jNXvHQRiQW58mOV3EDg6Wi8i35yT7BCmE20tSpIt/4P2Wk1IRVstJkXNPF3OIL/SwGFY9sWf9bdORaEBgEDhy4MPcT3GDlJ8IHeWpsiW/545QZzs2POJLhfYwY6VC/upT62NVisAgcKSGx+m1qv0+HATRDhMd2VP0EKtFrNix/vADhaNPkzdj/uj3BhAoNAUAj6QLUWJ0oKH1fvnqc9u0d8+Q2pd/QH5xoma7IGkJXSUpHSUJPPNiIzRi/zOkhTU+wsc1EAb0acB+AD1XIWGD+RuQZohL15RMFglfIbU2oIUS2Fi4BuNefHtc+9RLuqH8nC+Wb7g/vY599jLUlmkBqKDtvTX0vLh8nVvqnZ/pKn+VL33E6JVu/8mXz9GWj5CU/YY2hnwAepxChkf4bmrNEUy957oXeEjt60oia0aolxGI3hcvmGc6edDdqvBQatum8n082HFponqsidokiDAB4iHihE+UOs35sdzzgh6S+bei3KrCAuxFifJhMOMV7+mp0agjNeqpIJhFoo0BPAB4qFihA9tzkBTQQLngKC3bP599sjwYStOlgiGWpvPh8oOTNbWS5KyobZiEoIAP d printed information.", "hint": "Question 1", "msq": false}, {"text": "A student first enters their age as 15, but later realizes it should be 16 and updates it before\nthe participation slip is printed. Which age will appear on the slip?", "opts": {"A": "15", "B": "Both 15 and 16", "C": "16", "D": "No age will be displayed."}, "ans": ["C"], "just": "The latest value replaces the previous one, so the updated age is used.", "hint": "Question 2", "msq": false}, {"text": "The computer displays a greeting that includes the student's name without asking for it again.\nHow is this possible?", "opts": {"A": "The computer remembers every student's name forever.", "B": "The name is stored and reused whenever needed during the program.", "C": "The greeting works only for the first student.", "D": "The student secretly enters the name again."}, "ans": ["B"], "just": "The program stores the entered name and can use it multiple times without\nasking again.", "hint": "Question 3", "msq": false}, {"text": "A student accidentally enters the name Riya instead of Diya. Before the participation slip is\nprinted, the mistake is corrected. What is the most likely outcome?", "opts": {"A": "The slip will show Riya.", "B": "The slip will show both Riya and Diya.", "C": "The slip will show Diya.", "D": "The slip will not display any name."}, "ans": ["C"], "just": "Once the information is updated, the program uses the corrected value instead\nof the old one.", "hint": "Question 4", "msq": false}, {"text": "Why is it useful for the program to store information like a student's name and age?", "opts": {"A": "It allows the same information to be used multiple times without asking the student again.", "B": "It permanently stores the information on every computer.", "C": "It prevents the program from displaying messages.", "D": "It eliminates the need for user input in all future programs."}, "ans": ["A"], "just": "Storing information allows the program to reuse it whenever needed during its\nex }, {"text": "If the customer enters Neha as the name, what will be displayed in Line 8?", "opts": {"A": "Thank you for your order, customer", "B": "Thank you for your order, Neha", "C": "Thank you for your order, Pasta", "D": "Thank you for your order"}, "ans": ["B"], "just": "The variable customer contains the value Neha, which is displayed in the final\nmessage.", "hint": "Question 4", "msq": false}, {"text": "Why is the variable order updated in Line 6 instead of creating another variable?", "opts": {"A": "A variable can only store one value at a time, and the latest value replaces the previous one.", "B": "Python does not allow more than one variable in a program.", "C": "The original value cannot be changed.", "D": "Updating a variable permanently changes all future programs."}, "ans": ["A"], "just": "Assigning a new value to a variable replaces its previous value, so the program\nalways uses the latest information.", "hint": "Question 5", "msq": false}]}, {"title": "Online Bookstore Checkout", "text": "An online bookstore is developing a simple checkout system. When a customer selects a\n\nbook, the system asks for the book's price. Since the entered value comes from the keyboard,\n\nthe system first converts it into a number before performing any calculations. A 10%\n\ndiscount is then applied to the original price to calculate the final amount the customer has to\n\npay.\n\nWhile testing the program, the developers also discover that if they forget to convert the\n\nentered value into a number, mathematical calculations do not work as expected. They also\n\nlearn that Python is very particular about following the correct syntax and indentation rules.\n\nEven a small mistake, such as forgetting a colon or incorrect indentation, can prevent the\n\nprogram from running.", "images": [], "qs": [{"text": "Why does the program convert the customer's entered price into a number before calculating\nthe discount?", "opts": {"A": "To make the input appear on the screen.", "B": "To allow mathematical operations such as multiplication.", "C": "To permanently save the customer's purchase history.", "D": "To reduce the size of the program."}, "ans": ["B"], "just": "Keyboard input is initially treated as text. Converting it to a number allows\narithmetic operations like calculating discounts.", "hint": "Question 1", "msq": false}, {"text": "A customer enters the price of a book as ₹800. After applying a 10% discount, what amount\nshould the customer pay?", "opts": {"A": "₹720", "B": "₹780", "C": "₹880", "D": "₹700"}, "ans": ["A"], "just": "A 10% discount means the customer pays 90% of the original price: ₹800 ×\n0.9 = ₹720.", "hint": "Question 2", "msq": false}, {"text": "During testing, a developer forgets to convert the entered price into a number before\nperforming calculations. What is the most likely outcome?", "opts": {"A": "The calculations may fail or produce unexpected results.", "B": "The discount becomes 20% automatically.", "C": "The program permanently deletes the input.", "D": "Python automatically fixes the mistake."}, "ans": ["A"], "just": "Without converting the input into a numeric type, Python treats it as text, so\narithmetic operations cannot be performed correctly.", "hint": "Question 3", "msq": false}, {"text": "Another developer accidentally removes the required colon (:) from a Python statement.\nWhat is the most likely result?", "opts": {"A": "The program will ignore the missing colon and continue.", "B": "Python will report a syntax error.", "C": "The program will apply the wrong discount.", "D": "The program will ask the user to re-enter the price."}, "ans": ["B"], "just": "Python follows strict syntax rules. Missing required symbols, such as a colon,\nresults in a syntax error.", "hint": "Question 4", "msq": false}, {"text": "Which of the following statements are correct about the bookstore's discount program?\n(Select all that apply.)", "opts": {"A": "User input must often be converted into a number before performing arithmetic calculations.", "B": "Python requires correct syntax and indentation for a program to run properly.", "C": "A 10% discount means the customer pays 90% of the original price.", "D": "Python automatically treats every keyboard input as a number."}, "ans": ["A", "B", "C"], "just": "• A: Correct. User input is initially treated as text and often needs conversion.\n• B: Correct. Python is sensitive to syntax and indentation.\n• C: Correct. Paying after a 10% discount means paying 90% of the original price.\n• D: Incorrect. Keyboard input is treated as text unless explicitly converted.", "hint": "Question 5", "msq": false}]}, {"title": "Morning Exercise Counter", "text": "A school has installed a digital exercise board in the playground. Every morning, the board\n\ndisplays the number of jumping jacks students should perform. It starts from 1 and continues\n\nuntil the teacher decides to stop the session. The board repeatedly displays the next exercise\n\nnumber as long as the teacher chooses to continue.\n\nThe following Python program is used for the exercise board.", "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAxEAAAFPCAIAAAC9HtSfAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAt7klEQVR4nO3du2ocydvH8fcGdBW+A4GSxeDU4MC+ggEZZZp8AwdKHEgMbGBQvLIVLQxC2AtKJMQGs7lWiLWw0V7EBP/0na4+1eHpfvo00z2t74fBWD19qO4ZqX5TVV3zf0sAAABo/q/vAgAAAGwBMhMAAICOzAQAAKAjMwEAAOjITAAAADoyEwAAgI7MBAAAoCMzAQAA6MhMAAAAOjITAACAjswEAACgIzMBAADoyEwAAAA6MhMAAICOzAQAAKAjMwEAAOjITAAAADoyUxcuJjt7s4e+SwEM3eo3Zf+y70IAQENjz0yrv9GRyRr/TptD7J64kWlx9MvHV798+vJjufzx9X30/7Pb9RWhmaRgppBw/Tz79Gp1cSZff/ZdkjWI35wfj2663rH9Vr85Ey7g5b75dSQ2AdhO7TPT1fXbF/O3L76df++gOJ1rk5nMtpOL8pUuJ2Id8OPLJIsjcRVlZaawOuklvvSUmZI44j7enw0ruPWTmZJXxHqspQBry0z2Wz0+l7D8Dye7FX6tAGCI2mSm74vDVVqa3t1Oh5uZ2qiQmcznZimQBZnJrjzizGSFlTRGPIsmH3Oyz+JMazM5w4qPQdoeuiAzfViEKz3M9tbc9AsA69E8M90dpznp2Wam+9lu2CuXuP2Q1XYmP1mZKQoNk7OjSVY7RiscfTh7JkmCzFTIz0xbd63st7rJT1JmKv/FAYDh6mI801oyU9TnFf1VTTrXdvz4Yv7sRkusFey/wnEXQCIYoG2eXX3SjT/yeutc5nt0eX/lCxuZF an checks how many times a title appears in the list. To help students find books more\n\neasily, the catalog is sorted alphabetically. During special exhibitions, the sorted list is\n\ndisplayed in reverse alphabetical order. Occasionally, the librarian also displays only a\n\nselected range of books, such as books belonging to a particular shelf or category, instead of\n\nshowing the entire catalog.\n\nAnswer the following questions based on the scenario.", "images": [], "qs": [{"text": "Why does the librarian sort the catalog of books?", "opts": {"A": "To remove duplicate book titles", "B": "To make the books easier to organize and locate", "C": "To increase the number of books in the catalog", "D": "To replace old books with new ones"}, "ans": ["B"], "just": "Sorting arranges the book titles in a meaningful order, making them easier to\norganize, search, and analyze.", "hint": "Q1. Why does", "msq": false}, {"text": "After sorting the catalog alphabetically, the librarian wants to display the books from Z\nto A. Which operation is most suitable?", "opts": {"A": "Count", "B": "Append", "C": "Reverse", "D": "Length"}, "ans": ["C"], "just": "Reversing a sorted list changes the order from ascending (A–Z) to descending\n(Z–A).", "hint": "Q2. After so", "msq": false}, {"text": "The librarian wants to know how many copies of the book Python Basics are present in\nthe catalog. Which list operation is most appropriate?", "opts": {"A": "Length", "B": "Reverse", "C": "Insert", "D": "Count"}, "ans": ["D"], "just": "The count() operation returns the number of times a particular item appears in\nthe list.", "hint": "Q3. The libr", "msq": false}, {"text": "A newly purchased encyclopedia must appear as the second item in the catalog instead of\nbeing added at the end. Which operation should be used?", "opts": {"A": "Insert", "B": "Append", "C": "Sort", "D": "Reverse"}, "ans": ["A"], "just": "The insert() operation places an item at a specified position in the list.", "hint": "Q ing order.\n• B: Correct. sort() modifies the original list.\n• C: Incorrect. sort() does not create a new list; sorted() does.\n• D: Correct. Once sorted, extreme values are easy to locate and remove.", "hint": "Q5. (MSQ)", "msq": true}]}]}, {"week": 4, "scenarios": [{"title": "Birthday Collision Simulator", "text": "A data science club is developing a Python program to demonstrate the Birthday Paradox,\n\nwhich shows that in a surprisingly small group of people, two individuals are likely to share\n\nthe same birthday. Since collecting real birthday data is impractical, the program randomly\n\ngenerates birthdays for 50 people. It first generates a random year, month, and day while\n\nensuring that the generated date is valid by checking whether the selected year is a leap year.\n\nThe birthdays are stored as datetime.date objects and then converted into their corresponding\n\nday of the year (1–365 or 366), since only the day and month are relevant for detecting\n\nbirthday matches. These values are stored in a list, sorted in ascending order, and scanned for\n\nrepeated values. Each repeated value represents a birthday collision. Because the birthdays\n\nare generated randomly, running the program multiple times produces different numbers of\n\ncollisions, helping students understand the Birthday Paradox through simulation.", "images": [], "qs": [{"text": "Why does the program check whether a randomly generated year is a leap year?", "opts": {"A": "To ensure that February is assigned the correct number of days.", "B": "To reduce the number of duplicate birthdays.", "C": "To generate birthdays in chronological order.", "D": "To calculate the person's age."}, "ans": ["A"], "just": "Leap years determine whether February has 28 or 29 days.", "hint": "MCQ 1", "msq": false}, {"text": "Which Python library is primarily responsible for creating valid calendar dates in the\nprogram?", "opts": {"A": "random", "B": "math", "C": "datetime", "D": "calendar"}, "ans": ["C"], "just": "The datetime library is used to represent birthdays as valid date objects.", "hint": "MCQ 2", "msq": false}, {"text": "Why does the program convert each birthday into its \"day of the year\" value?", "opts": {"A": "To calculate the age of each person.", "B": "To compare birthdays without considering the birth year.", "C": "To reduce the amount of memory used.", "D": "To make sorting unnecessary."}, "ans": ["B"], "just": "Only the day and month matter when checking for birthday collisions.", "hint": "MCQ 3", "msq": false}, {"text": "Why is the list of day-of-year values sorted before checking for collisions?", "opts": {"A": "To generate birthdays more efficiently.", "B": "To remove invalid dates automatically.", "C": "To arrange birthdays by year.", "D": "To make duplicate values easier to identify."}, "ans": ["D"], "just": "Sorting places identical values next to each other, making collisions easy to\ndetect.", "hint": "MCQ 4", "msq": false}, {"text": "Why does the program usually produce a different number of collisions each time it is\nexecuted?", "opts": {"A": "The random birthday generation creates a different set of birthdays in every run.", "B": "The leap year calculation changes during execution.", "C": "The sorting algorithm produces a different order every time.", "D": "The datetime library stores dates differently in each execution."}, "ans": ["A"], "just": "Different randomly generated birthdays result in different collision counts.", "hint": "MCQ 5", "msq": false}]}, {"title": "Digital Dobble Card Generator", "text": "A game development team is creating a digital version of the Dobble card game using\n\nPython. Each card contains five symbols, represented by letters of the alphabet. The program\n\nrandomly generates two cards such that exactly one symbol is common between them, while\n\nall other symbols are unique. To achieve this, it uses Python's string library to obtain a pool\n\nof symbols and the random library to select symbols and their positions. Once a symbol is\n\nplaced on a card, it is removed from the available pool to prevent duplicates. After generating\n\nthe cards, the program displays them and asks the player to identify the common symbol. If\n\nthe player's input matches the common symbol, the program prints \"Correct\"; otherwise, it\n\nprints \"Wrong\". During testing, the developers also discovered that generating random\n\nindices from 0 to 5 for a five-element list caused an IndexError, which was fixed by\n\ngenerating indices from 0 to 4.", "images": [], "qs": [{"text": "What is the primary objective of the Python program?", "opts": {"A": "To generate two cards with exactly one common symbol.", "B": "To sort symbols alphabetically before displaying them.", "C": "To count the number of vowels on each card.", "D": "To generate identical cards every time."}, "ans": ["A"], "just": "The program is designed so that the two cards share exactly one common\nsymbol.", "hint": "MCQ 1", "msq": false}, {"text": "Which of the following steps help ensure that the two cards contain exactly one common\nsymbol? (Select all that apply.)", "opts": {"A": "Removing the common symbol from the symbol pool after placing it.", "B": "Removing every newly assigned symbol from the available symbol pool.", "C": "Randomly choosing only one symbol to be shared between both cards.", "D": "Sorting the cards after they are generated."}, "ans": ["A", "B", "C"], "just": "Removing used symbols prevents extra matches, while random positions\ndetermine where the single common symbol appears. Sorting does not affect the card\ncontents.", "hint": "MCQ 2 (MSQ)", "msq": true}, {"text": "Why does the program use random.choice()?", "opts": {"A": "To sort the available symbols.", "B": "To select a symbol randomly from the available symbol list.", "C": "To compare the two cards.", "D": "To convert uppercase letters into lowercase letters."}, "ans": ["B"], "just": "random.choice() selects a random element from a list.", "hint": " UALFl+SpmTUk+9uXx1ORXPRF9XShnu0JlIqZ9mMoWYUtGSUnXllJhqMe9kTDql3OwJNQ9CxMblXjR7wo0NitkTeSkVzIlQkiN+5i6ezU7NBuvZHPWuejnahjl+AJZtkz7Vu8LRJz4qdMuTAGAVSKmBuPYEZ6QArMAmpRQAYNOQUgCAcpFSAIBykVIAgHKRUgCAcv0/UxZMXd8L5vwAAAAASUVORK5CYII="], "qs": [{"text": "What is the purpose of the dictionary wins_against?", "opts": {"A": "It stores the scores of both players.", "B": "It stores the choices made by each player.", "C": "It stores which move defeats another move.", "D": "It stores the winner of each round."}, "ans": ["C"], "just": "The dictionary maps each move to the move it defeats. For example, \"Rock\" maps to\n\"Scissors\" because Rock beats Scissors.", "hint": "Q1. (MCQ)", "msq": false}, {"text": "What is the value of the score dictionary after the loop finishes?", "opts": {"A": "{\"Player A\": 2, \"Player B\": 2}", "B": "{\"Player A\": 3, \"Player B\": 1}", "C": "{\"Player A\": 4, \"Player B\": 0}", "D": "{\"Player A\": 1, \"Player B\": 3}"}, "ans": ["B"], "just": "Player A wins Rounds 1, 2, and 3, while Player B wins Round 5. Round 4 is a draw, so the\nfinal score is {\"Player A\": 3, \"Player B\": 1}.", "hint": "Q2. (MCQ)", "msq": false}, {"text": "What does the expression wins_against[playerA[i]] return?", "opts": {"A": "The current score of Player A.", "B": "The move that defeats Player A's current move.", "C": "The move defeated by Player A's current move.", "D": "The current round number."}, "ans": ["C"], "just": "The expression retrieves the value associated with Player A's current move from the\ndictionary. For example, if Player A chooses \"Paper\", it returns \"Rock\".", "hint": "Q3. (MCQ)", "msq": false}, {"text": "Which statement is printed at the end of the program?", "opts": {"A": "Player A Wins", "B": "Player B Wins", "C": "Match Draw", "D": "No output is printed."}, "ans": ["A"], "just": "Player A scores 3 points, while Player B scores 1 point. Since Player A has the higher score,\nthe program prints \"Player A Wins\".", "hint": "Q4. (MCQ)", "msq": false} d Binary Search: -1"}, "ans": ["B"], "just": "The value 134 is present at index 4 in the list. Both search algorithms locate the same element\nand return the same index.", "hint": "Q2. (MCQ)", "msq": false}, {"text": "During the first iteration of the Binary Search loop, what is the value of mid?", "opts": {"A": "2", "B": "3", "C": "4", "D": "5"}, "ans": ["B"], "just": "Initially, low = 0 and high = 7. Therefore, mid = (0 + 7) // 2 = 3.", "hint": "Q3. (MCQ)", "msq": false}, {"text": "Suppose the statement break on Line 9 is removed. Which statement is correct?", "opts": {"A": "The program produces an error.", "B": "The Linear Search continues checking the remaining elements even after finding the target.", "C": "The Binary Search stops working.", "D": "The value of linear_index becomes -1."}, "ans": ["B"], "just": "Without the break, the loop continues until the end of the list. Since the target appears only\nonce, the final value of linear_index remains unchanged.", "hint": "Q4. (MCQ)", "msq": false}, {"text": "Which of the following statements are correct?", "opts": {"A": "Linear Search checks elements one by one from the beginning of the list.", "B": "Binary Search repeatedly divides the search space into two halves.", "C": "Both Linear Search and Binary Search return index 4 for the given input.", "D": "Binary Search can be applied correctly even if book_ids is not sorted."}, "ans": ["A", "B", "C"], "just": "Linear Search examines elements sequentially, while Binary Search repeatedly halves the\nsearch range. Since the target exists at index 4, both algorithms return 4; however, Binary\nSearch requires the list to be sorted.", "hint": "Q5. (MSQ)", "msq": true}]}, {"title": "Airport Boarding Gate Search", "text": "An airport maintains a sorted list of boarding gate numbers for departing flights.\n\n[101, 104, 108, 112, 117, 121, 126, 130, 135, 140]\n\nA passenger is looking for Gate 126. The airport system can use either Linear Search or\n\nBinary Search to locate the gate.\n\nAnswer the following questions.", "images": [], "qs": [{"text": "How many elements would Linear Search examine before finding Gate 126?", "opts": {"A": "5", "B": "6", "C": "7", "D": "8"}, "ans": ["C"], "just": "Linear Search checks elements one by one from the beginning. Gate 126 is the 7th element in\nthe list, so seven comparisons are required.", "hint": "Q1. (MCQ)", "msq": false}, {"text": "During the first comparison of Binary Search, which gate number is examined?", "opts": {"A": "112", "B": "117", "C": "121", "D": "126"}, "ans": ["B"], "just": "The middle index of a 10-element list is (0 + 9) // 2 = 4. The element at index 4 is 117.", "hint": "Q2. (MCQ)", "msq": false}, {"text": "After the first Binary Search comparison, which part of the list will be searched next?", "opts": {"A": "[101, 104, 108, 112]", "B": "[101, 104, 108, 112, 117]", "C": "[121, 126, 130, 135, 140]", "D": "[126, 130, 135, 140]"}, "ans": ["C"], "just": "Since 126 is greater than 117, Binary Search discards the left half. It continues searching the\nright half of the list.", "hint": "Q3. (MCQ)", "msq": false}, {"text": "Why is Binary Search generally faster than Linear Search for large sorted lists?", "opts": {"A": "It compares every element only once.", "B": "It checks two elements in every comparison.", "C": "It eliminates half of the remaining search space after each comparison.", "D": "It works only on lists with unique values."}, "ans": ["C"], "just": "Binary Search reduces the search space by half after each comparison. This makes it much\nmore efficient than checking elements one by one.", "hint": "Q4. (MCQ)", "msq": false}, {"text": "Which of the following statements are correct?", "opts": {"A": "Binary Search requires the list to be sorted.", "B": "Linear Search can be used on both sorted and unsorted lists.", "C": "Both Linear Search and Binary Search will locate Gate 126 in this scenario.", "D": "Binary Search always examines every element in the list."}, "ans": [" re not\nblank.", "hint": "Q1. (MCQ)", "msq": false}, {"text": "What is the purpose of the break statement in Line 12?", "opts": {"A": "It skips the current row.", "B": "It exits the loop after finding a winner.", "C": "It resets the board.", "D": "It starts checking the rows again."}, "ans": ["B"], "just": "Once a winning row is found, there is no need to examine the remaining rows.", "hint": "Q2. (MCQ)", "msq": false}, {"text": "Which variable stores the winning player's symbol?", "opts": {"A": "board", "B": "row", "C": "winner", "D": "print"}, "ans": ["C"], "just": "The variable winner is updated with 'X' or 'O' when a winning row is found.", "hint": "Q3. (MCQ)", "msq": false}, {"text": "If Line 11\nwinner = row[0]\nis replaced with\nwinner = \"Player\"\nwhat will the program display when a winning row is found?", "opts": {"A": "The winning symbol (X or O)", "B": "\"Player\"", "C": "\"None\"", "D": "The entire row"}, "ans": ["B"], "just": "The variable winner would always contain the string \"Player\" instead of the\nwinning symbol.", "hint": "Q4. (MCQ)", "msq": false}, {"text": "Which of the following statements about the program are correct? (Select all that apply.)", "opts": {"A": "The board is represented using a nested list.", "B": "The program checks only row-wise winning conditions.", "C": "The loop stops immediately after a winner is found.", "D": "The program checks both row-wise and diagonal winning conditions."}, "ans": ["A", "B", "C"], "just": "• A: Correct. The board is stored as a list of lists.\n• B: Correct. The program examines only the rows for a winning condition.\n• C: Correct. The break statement terminates the loop once a winner is detected.\n• D: Incorrect. The program does not check diagonal or column-wise winning\nconditions.", "hint": "Q5. (MSQ)", "msq": true}]}, {"title": "Recursive Folder Search", "text": "A company stores its documents in a hierarchy of folders. Each folder can contain:\n\n• Files\n\n• Other folders\n\nA software engineer is asked to write a program to find a file named Report.pdf. The program\n\nbegins with the main folder. Whenever it encounters a subfolder, it performs the same search\n\nprocess inside that subfolder. If the file is found, the search stops. If a folder contains no more\n\nsubfolders or files, the program returns to the previous folder and continues searching.\n\nNo loops are explicitly used to revisit folders; instead, the same search procedure is\n\nrepeatedly applied to each subfolder.\n\nQuestions", "images": [], "qs": [{"text": "Which characteristic of the search process best represents recursion?", "opts": {"A": "The search visits folders in alphabetical order.", "B": "The same search procedure is applied repeatedly to each subfolder.", "C": "Every folder contains the same number of files.", "D": "The search uses multiple computers simultaneously."}, "ans": ["B"], "just": "In recursion, the same task is performed repeatedly on smaller instances of the\nsame problem.", "hint": "Q1. (MCQ)", "msq": false}, {"text": "In this scenario, what is the base case for the recursive search?", "opts": {"A": "The search begins from the main folder.", "B": "A folder contains only PDF files.", "C": "A folder has no more files or subfolders to search, or the required file is found.", "D": "The search enters a subfolder."}, "ans": ["C"], "just": "A recursive process stops when it reaches a condition where no further\nrecursive calls are needed.", "hint": "Q2. (MCQ)", "msq": false}, {"text": "Why is recursion a suitable approach for this problem?", "opts": {"A": "Every folder has exactly one subfolder.", "B": "The same search operation must be repeated for each subfolder.", "C": "Recursion is always faster than iteration.", "D": "Files can only exist in the main folder."}, "ans": ["B"], "just": "Each subfolder is simply a smaller version of the original problem, making\nrecursion a natural solution.", "hint": "Q3. (MCQ)", "msq": false}, {"text": "What would most likely happen if the search process had no base case?", "opts": {"A": "The search would immediately stop.", "B": "The search would examine only the main folder.", "C": "The search could continue indefinitely or until system resources are exhausted.", "D": "The search would automatically switch to an iterative approach."}, "ans": ["C"], "just": "Without a stopping condition, recursive calls continue indefinitely, eventually\ncausing a stack overflow or exhausting system resources.", "hint": "Q4. (MCQ)", "msq": false}, {"text": "Which of the following statements correctly describe recursion in the given scenario? (Select\nall that apply.)", "opts": {"A": "The same search procedure is used for every subfolder.", "B": "The search must have a stopping condition.", "C": "Each subfolder represents a smaller instance of the original problem.", "D": "Recursion can only be used if every folder contains exactly one subfolder."}, "ans": ["A", "B", "C"], "just": "• A: Correct. The same search logic is applied to every subfolder.\n• B: Correct. Every recursive solution requires a base case to terminate.\n• C: Correct. Each subfolder is a smaller version of the original folder search problem.\n• D: Incorrect. A folder may contain any number of subfolders or none at all; recursion\ndoes not require exactly one subfolder.", "hint": "Q5. (MSQ)", "msq": true}]}, {"title": "Recursive Binary Search for Student Roll Numbers", "text": "A university stores student roll numbers in ascending order. When an administrator wants to\n\nverify whether a particular roll number exists, the system performs a recursive binary search.\n\nThe search begins by checking the middle roll number in the current range.\n\n• If the middle roll number matches the required roll number, the search is successful.\n\n• If the required roll number is smaller, the same search process is repeated on the left\n\nhalf.\n\n• If the required roll number is larger, the search continues recursively on the right half.\n\n• If the search range becomes invalid (the left index becomes greater than the right\n\nindex), the roll number is reported as not found.\n\nThe following program implements this recursive binary search.", "images": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAscAAAJkCAIAAAByHBs5AAAACXBIWXMAAA7EAAAOxAGVKw4bAABMj0lEQVR4nO3dvW4bS5738bkBXoXuQICTgYFJBSiQr4CAFs7E3MEESk4ggYCCART7nGFkgCCEoQElFAgHck4bgkWMIadPuFjuzAa7wdNV/VZVXdVv/DdfxO8HxDl0s1+qm2TXr6uqqT+tDP8PAACgrT+tAAAAJJAqAACADFIFWnq6Pj6+ftp2KbCPnoZvjofft10KAB1YJ1U8P14cjc9OH5dipVmt7vq9Xn/SYObE+V3pnN9u3k5uZuHXZw/vy2c4LFWHS0eK6I0qP+ib9OVyEr2D6tH/+nPTG//1qT/58PFX8PUmn66fHz9vYxc2btLfqc8PACltU8XydhrlidFge6kiutypDBMZUkUjVYfr+/C4t4vXmluqknc5VVQHxC6Vbf3uvNd7M6SxC3hl2qWK58eLwSL6/3yLqaJRq8Z2z617p+Jwqfqgbp7bqB1NFU0cTqpo+BUGsB/WG1chlSomeVdGzzzRqGviRKELv0WqUP+N28nzM93y64fixGSRz5+W2SLR8/y1vL3dWipeRNUx1iLqUtVcvGYllK2nUDZ97euZbuyLWTOpiuryW75U9Nxg7ktaKudwWfuuj7y3ocIssLGIKtXDl1W2tuh56eFag7dKVhPdHfS8BclRaiNe27ds92t8ular/IBYZYt34UtW5pZF8qzfXlvTNytY4JX1ETLf3JKtJ/zxVJ8NGLID7KkdSBXqJJLVUkZW0JEizQ1qenKisSNIHDmqWuPjc1xy9tTVjHm6XPkuqqxF1Hkzq65mD9mc9qqSM6lZPehF7DpM1e7O1j3UFr01iplRdKWVFubXp8usQlUlybaYVqvxRq09tfarzr6vgj3iPz8+ZJWTtUhas8YbNfYrdLjaK66k+AbFm4uK4aSK4pTakho63sF6ny69SHIcrI9H8mbFL1nvbzv+1oLmb1awwObihX2vaimJPkvFThBSBbDPtp8qousV4wySpwo1HtC4jlH/tE5A6/SAxFfJJTMUpoSigDoLZ6uy6nJzEbO2C8YFm77+82zRqfxCazOn2+d6o0qwCm8q2/fCG+FjLmJXjcahCB6u1gqpwm2TyGbIWiay47lmqsiX9RxV76crn8dsJrF3Yf2+lRo9IHXfLG+Bna9S8YtWlSoYswm8LltPFWrQpTdVqNZRh2SqKM0QxSlWnee07lqpInAOzU6+xUAT5LuvweoWcRqWzaZ+d7q3GSBYkbdKFWb/i9kYXjO7SCjsaWET2b5ET9Sc3276nz+oJ+rAti1Mi1RhXvoXGpY2kCoav1mBArvrKfYJkiqAw7K7qcJpqyhYI1XUvZr01qzm6dXTVhE6hyaXwtF6GveUW1sMXlLbozfctgpvqmjVVhGoCcIND9tMFcG2ClWq6MnsIXr1y2U8gKb1wI62qcI34GAjqaLFmxUqcPlxa9UDAmCfdZIqFtcn43cn09GPOuswrn2T35/wjasoap8qfIMJ6qcK84wcn2prpYr4fP2h36bqsro53LGfCaubIx6YWZkq4vIHxlWEe398R95qOY/bctZMFfGHodmFbMW4CreQDzeXumAqW3y9Kexj7a03TxXJoMjKXXBThf6ZkEZjDuwQnG+94ZsVLnBgaE546wZGawKvT8tUsbg6Gp9Zj9nceLVJqkh+eSLJE+q59x6QwommUaoovTT0j2wP16zWLRjmtVp5NRmqwmsU2FnKKIDR4GwsEt9 s linear search if the attractions are stored in random order. If the attractions\n\nare sorted alphabetically, the application uses binary search to locate the attraction more\n\nefficiently.\n\nAfter an attraction is found, its latitude and longitude are used to place a marker on a Google\n\nMap so that visitors can easily navigate to the destination.\n\nThe application also includes a Treasure Trail game. Visitors move across 25 checkpoints\n\nusing dice rolls. Some checkpoints contain ladders that move visitors ahead, while others\n\ncontain snakes that move them backward. If a dice roll takes a visitor beyond the final\n\ncheckpoint, that move is ignored.\n\nThe developers use appropriate data structures and algorithms so that the application remains\n\nefficient and easy to maintain.", "images": [], "qs": [{"text": "The attractions are stored in random order. Which searching technique is most appropriate for\nfinding a particular attraction?", "opts": {"A": "Binary Search", "B": "Spiral Search", "C": "Linear Search", "D": "Depth First Search"}, "ans": ["C"], "just": "Linear search is suitable when the data is not sorted.", "hint": "Question 1 (", "msq": false}, {"text": "Why does the inspection drone use a spiral traversal of the city matrix?", "opts": {"A": "To visit only the corner locations.", "B": "To inspect every location by moving from the outer boundary towards the center.", "C": "To sort the locations alphabetically.", "D": "To search for a specific attraction."}, "ans": ["B"], "just": "Spiral traversal systematically covers all cells from the outer layer to the center.", "hint": "Question 2 (", "msq": false}, {"text": "Which information is essential for placing an attraction on the Google Map?", "opts": {"A": "Name and Category", "B": "Rating and Category", "C": "Latitude and Longitude", "D": "Name and Rating"}, "ans": ["C"], "just": "A map marker requires geographic coordinates to determine its location.", "hint": "Question 3 (", "msq": false}, {"text": "In the Treasure Trail game, what should happen if a dice roll moves the visitor beyond\ncheckpoint 25?", "opts": {"A": "The visitor returns to checkpoint 1.", "B": "The visitor wins immediately.", "C": "The visitor moves to checkpoint 25.", "D": "The move is ignored."}, "ans": ["D"], "just": "The game rules specify that moves beyond the final checkpoint are not allowed.", "hint": "Question 4 (", "msq": false}, {"text": "Which of the following statements are true about the Smart Heritage City Explorer?", "opts": {"A": "Binary search can be used efficiently even if the attractions are stored in random order.", "B": "A dictionary is suitable for storing multiple details about each attraction.", "C": "Spiral traversal is a suitable approach for visiting every location in a matrix.", "D": "Google Map markers are placed using the latitude and longitude of an attraction."}, "ans": ["B", "C"], "just": "Dictionaries can store multiple attributes of an attraction, and spiral traversal\nvisits every matrix location exactly once.", "hint": "Question 5 (", "msq": true}]}]}, {"week": 8, "scenarios": [{"title": "Student Record Management", "text": "A college stores each student's information as a tuple because these details do not change\n\nduring a semester.\n\nOne student's record is stored as:\n\n(\"Ananya\", 1023, \"Computer Science\", 8.7)\n\nThe information is stored in the following order:\n\n• Student Name\n\n• Student ID\n\n• Department\n\n• CGPA\n\nThe college uses this tuple whenever it needs to retrieve a student's information.", "images": [], "qs": [{"text": "Which piece of information is stored in the third position of the tuple?", "opts": {"A": "Student Name", "B": "Student ID", "C": "Department", "D": "CGPA"}, "ans": ["C"], "just": "The third value in the tuple is \"Computer Science\", which represents the\nstudent's department.", "hint": "Q1. Which pi", "msq": false}, {"text": "Why is a tuple a suitable data structure for storing this record?", "opts": {"A": at is stored in the list fridays after the loop completes?", "opts": {"A": "The weekday numbers of all Fridays", "B": "The dates that fall on Fridays in the selected month", "C": "The week numbers containing Fridays", "D": "The total number of Fridays"}, "ans": ["B"], "just": "Each valid Friday date is appended to the list.", "hint": "Question 1 (", "msq": false}, {"text": "Why is the condition week[4] != 0 used?", "opts": {"A": "To ignore holidays that fall on Fridays", "B": "To ensure the Friday belongs to the selected month", "C": "To identify leap years", "D": "To count only the first Friday"}, "ans": ["B"], "just": "A value of 0 represents a day outside the selected month.", "hint": "Question 2 (", "msq": false}, {"text": "What is the purpose of fridays[-1] in Line 19?", "opts": {"A": "It returns the first Friday of the month.", "B": "It returns the total number of Fridays.", "C": "It returns the last element in the fridays list.", "D": "It removes the last Friday from the list."}, "ans": ["C"], "just": "Negative index -1 accesses the last element of a list.", "hint": "Question 3 (", "msq": false}, {"text": "Suppose the selected month has Friday dates 3, 10, 17, 24, and 31. What will be printed by\nLine 19?", "opts": {"A": "24", "B": "17", "C": "5", "D": "31"}, "ans": ["D"], "just": "The last element of the list [3, 10, 17, 24, 31] is 31.", "hint": "Question 4 (", "msq": false}, {"text": "Which of the following statements are correct?", "opts": {"A": "calendar.monthcalendar() returns a string containing the monthly calendar.", "B": "week[4] represents the fifth week of the month.", "C": "The list fridays stores the dates that fall on Fridays.", "D": "The program displays the last Friday only if at least four Fridays are present in the month."}, "ans": ["C", "D"], "just": "The list stores Friday dates, and the last Friday is printed only when the list\ncontains at least four elements.", "hint": "Question 5 (", "msq": true}]}]}, {"week": 12, "scenarios": [{"title": "Ranking the Most Influential Campus Clubs", "text": "A university has created a student portal where every club has its own webpage. Each club\n\npage contains links to other club pages that it collaborates with or recommends. The\n\nuniversity wants the homepage to display the most influential clubs first, not simply those\n\nwith the highest number of incoming links. They decide to use the PageRank algorithm\n\nbecause it considers both the quantity and quality of incoming links. Clubs that receive\n\nrecommendations from already influential clubs are expected to receive higher rankings.\n\nAnswer the following questions based on this scenario.", "images": [], "qs": [{"text": "Why is the university using PageRank instead of simply counting the number of\nincoming links?", "opts": {"A": "Because it considers the importance of the pages providing the links.", "B": "Because it ranks pages alphabetically.", "C": "Because it only counts outgoing links.", "D": "Because it ignores linked pages completely."}, "ans": ["A"], "just": "PageRank assigns greater value to links coming from highly ranked pages.", "hint": "Q1. Why is t", "msq": false}, {"text": "Suppose a newly created club page receives a recommendation from a highly ranked\nclub. What is the most likely outcome?", "opts": {"A": "The new club will always become the highest-ranked page immediately.", "B": "The recommendation has no effect because the page is new.", "C": "The new club's PageRank is likely to improve due to the influential incoming link.", "D": "The recommending club loses all of its PageRank."}, "ans": ["C"], "just": "Links from influential pages contribute positively to the recipient's PageRank.", "hint": "Q2. Suppose ", "msq": false}, {"text": "If one club page links to hundreds of other club pages, how does this affect the value of\neach outgoing link?", "opts": {"A": "Each outgoing link becomes more valuable.", "B": "Each outgoing link shares only a smaller portion of the page's ranking val let cur=1,st={};
try{st=JSON.parse(localStorage.getItem("mcq-state")||"{}")}catch(e){st={}}
function save(){try{localStorage.setItem("mcq-state",JSON.stringify(st))}catch(e){}}
const key=(w,s,q)=>w+"-"+s+"-"+q;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function score(w){let a=0,c=0;w.scenarios.forEach((s,i)=>s.qs.forEach((q,j)=>{const r=st[key(w.week,i,j)];if(r&&r.done){a++;if(r.ok)c++}}));return[a,c]}
function nav(){const n=document.getElementById("weeks");n.textContent="";let ta=0,tc=0;
DATA.forEach(w=>{const[a,c]=score(w);ta+=a;tc+=c;const b=el("button","","Week "+w.week);b.append(Object.assign(el("small"),{textContent:a?c+"/"+a+" correct":"20 questions"}));
if(w.week===cur)b.setAttribute("aria-current","true");b.onclick=()=>{cur=w.week;render();window.scrollTo(0,0)};n.append(b)});
document.getElementById("total").textContent=ta?tc+" correct of "+ta+" answered":"240 questions"}
function render(){nav();const w=DATA.find(x=>x.week===cur),m=document.getElementById("main");m.textContent="";
const[a,c]=score(w),h=el("div","wkhead");h.append(el("h2","","Week "+w.week+" ("+a+" of 20 answered, "+c+" correct)"));
const rb=el("button","act ghost","Reset this week");rb.onclick=()=>{w.scenarios.forEach((s,i)=>s.qs.forEach((q,j)=>delete st[key(w.week,i,j)]));save();render()};h.append(rb);m.append(h);
w.scenarios.forEach((s,i)=>{const sec=el("section","scn");sec.append(el("h3","",s.title));const cx=el("div","ctx");if(s.text)cx.append(el("p","",s.text));
s.images.forEach(u=>{const im=el("img");im.src=u;im.alt="Code or figure for this scenario";cx.append(im)});sec.append(cx);
s.qs.forEach((q,j)=>sec.append(card(w,i,j,q)));m.append(sec)})}
function card(w,i,j,q){const k=key(w.week,i,j),r=st[k]||{sel:[],done:false},d=el("div","q");q.msq=q.msq||q.ans.length>1;
d.append(el("p","qk","Question "+(j+1)+(q.msq?" (select all that apply)":"")));d.append(el("p","qt",q.text));
const box=el("div","opts");d.append(box);const btns={};
function paint(){Object.keys(q.opts).forEach(L=>{const b=btns[L];const sel=r.sel.includes(L),right=q.ans.includes(L);b.className="opt";b.disabled=r.done;b.setAttribute("aria-pressed",sel);
const t=b.querySelector(".tag");t.textContent="";if(q.msq)b.querySelector("b").textContent=(sel?"☑ ":"☐ ")+L+".";
if(r.done){if(right){b.classList.add("ok");t.textContent=sel?"Correct":"Correct answer"}else if(sel){b.classList.add("bad");t.textContent="Wrong"}}})}
Object.entries(q.opts).forEach(([L,t])=>{const b=el("button","opt");b.append(el("b","",L+"."),el("span","",t),el("span","tag"));
b.onclick=()=>{if(r.done)return;if(q.msq){r.sel=r.sel.includes(L)?r.sel.filter(x=>x!==L):[...r.sel,L];st[k]=r;paint();chk.disabled=!r.sel.length}else{r.sel=[L];finish()}};btns[L]=b;box.append(b)});
const chk=el("button","act","Check answer");chk.disabled=!r.sel.length;chk.onclick=()=>finish();if(q.msq&&!r.done)d.append(chk);
const fb=el("div");d.append(fb);
function finish(){r.done=true;r.ok=r.sel.length===q.ans.length&&q.ans.every(x=>r.sel.includes(x));st[k]=r;save();paint();chk.remove();feedback();nav2()}
function nav2(){const w2=DATA.find(x=>x.week===cur);nav();document.querySelector(".wkhead h2").textContent="Week "+w2.week+" ("+score(w2)[0]+" of 20 answered, "+score(w2)[1]+" correct)"}
function feedback(){fb.textContent="";fb.className="fb "+(r.ok?"ok":"bad");fb.append(el("strong","",r.ok?"Correct":"Not quite"));
fb.append(el("p","","Correct answer: "+q.ans.map(L=>L+". "+q.opts[L]).join("\n")));
fb.append(el("p","","Justification: "+q.just));const t=el("button","act ghost","Try again");t.onclick=()=>{delete st[k];save();render()};fb.append(t)}
paint();if(r.done)feedback();return d}
render();
</script></body></html>
